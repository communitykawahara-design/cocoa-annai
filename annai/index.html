<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* 選ぶ画面は夜空の一枚絵（暗い単一テーマ）。4つの案は、それぞれ明るい単一テーマで色を決め打ちにする。 */
:root{
  --fx-bg:#0E0B24; --fx-ink:#EEE8FF; --fx-sub:#C3B9E6; --fx-glow:#BFA8FF; --fx-gold:#FFD9A0; --fx-card:rgba(255,255,255,.06); --fx-line:rgba(220,205,255,.22);
  --a-bg:#F6ECE6; --a-ink:#4A2F25; --a-sub:#6E5044; --a-card:#FFFDFB; --a-c1:#8B5A44; --a-c2:#C0607A; --a-c3:#3F8E7E; --a-c4:#C98A2E;
  --b-bg:#F3F6FA; --b-band:#1D3557; --b-ink:#1B2533; --b-sub:#3F4B5C; --b-card:#FFFFFF; --b-tint:#E3ECF7; --b-line:#D5DEEA; --b-link:#1F5BA8;
  --c-bg:#EEF1EA; --c-ink:#1F2B24; --c-sub:#46564B; --c-acc:#4E6E55; --c-line:#C6D0C0;
  --d-bg:#F4F6F8; --d-ink:#1E2430; --d-sub:#4A5262; --d-t1:#17756F; --d-t2:#B83E2A; --d-t3:#E2A93B; --d-t3ink:#2A1E05; --d-t4:#3B4A9C;
  --f-maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --f-ud:"BIZ UDPGothic","Hiragino Sans","Meiryo",sans-serif;
  --f-mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-kaku:"Zen Kaku Gothic New","Hiragino Sans","Meiryo",sans-serif;
  --f-round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
}
html,body{height:100%}
body{background:var(--fx-bg);color:var(--fx-ink)}
body[data-look="A"]{background:var(--a-bg)} body[data-look="B"]{background:var(--b-bg)}
body[data-look="C"]{background:var(--c-bg)} body[data-look="D"]{background:var(--d-bg)}
html.lock body{overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a:focus-visible,button:focus-visible{outline:3px solid #7DB3FF;outline-offset:3px}

/* ===== 選ぶ画面（幻想的） ===== */
.fx{position:relative;min-height:100%;color-scheme:dark;font-family:var(--f-mincho);
  background:radial-gradient(120% 80% at 70% 0%,#2C1F5C 0%,transparent 60%),radial-gradient(90% 70% at 0% 100%,#132A4F 0%,transparent 60%),var(--fx-bg)}
.fx::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(40% 30% at 30% 30%,rgba(160,120,255,.18),transparent 70%),radial-gradient(35% 25% at 75% 65%,rgba(90,200,255,.12),transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fx-main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-block:clamp(48px,11vh,128px) 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:clamp(36px,6vh,64px)}
.fx-msg{margin:0;display:grid;gap:.35em;font-weight:500;line-height:1.25;text-wrap:balance}
.fx-msg .ln{display:block}
.fx-l1{font-size:clamp(46px,10vw,104px);font-weight:700;letter-spacing:.08em;color:#FFF7EA}
.fx-l2{font-size:clamp(22px,4.2vw,38px);letter-spacing:.12em;color:var(--fx-ink)}
.fx-l3{font-size:clamp(24px,4.8vw,44px);letter-spacing:.1em;color:var(--fx-ink)}
.ch{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(.35em) scale(.96);
  text-shadow:0 0 18px rgba(191,168,255,.75),0 0 42px rgba(191,168,255,.35);
  animation:chIn 1.4s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--d) + var(--i) * 85ms)}
.fx-l1 .ch{text-shadow:0 0 22px rgba(255,217,160,.8),0 0 60px rgba(255,190,140,.4)}
@keyframes chIn{to{opacity:1;filter:blur(0);transform:none}}
.fx-l1 .ch{animation:chIn 1.6s cubic-bezier(.2,.7,.2,1) forwards,glow 4.5s ease-in-out infinite;animation-delay:calc(var(--d) + var(--i) * 120ms),calc(3s + var(--i) * 300ms)}
@keyframes glow{50%{text-shadow:0 0 30px rgba(255,225,180,1),0 0 80px rgba(255,190,140,.6)}}
.fx-lead{margin:0;max-width:36em;font-family:var(--f-kaku);font-size:16px;line-height:1.9;color:var(--fx-sub)}
.later{opacity:0;translate:0 14px;animation:up 1.2s ease forwards;animation-delay:var(--d,3.6s)}
@keyframes up{to{opacity:1;translate:0 0}}
.fx-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.fx-card{position:relative;display:grid;gap:14px;padding:14px 14px 18px;border-radius:18px;background:var(--fx-card);
  border:1px solid var(--fx-line);box-shadow:0 0 0 1px rgba(255,255,255,.02),0 20px 50px rgba(5,2,20,.5);backdrop-filter:blur(6px);transition:transform .4s ease,border-color .4s ease,box-shadow .4s ease}
.fx-card:hover{transform:translateY(-4px);border-color:rgba(230,215,255,.5);box-shadow:0 0 40px rgba(170,140,255,.25),0 24px 60px rgba(5,2,20,.6)}
.fx-card.is-picked{border-color:var(--fx-gold);box-shadow:0 0 40px rgba(255,217,160,.35)}
.th{position:relative;aspect-ratio:1100/700;max-width:100%;overflow:hidden;border-radius:10px;background:#fff}
.th-in{position:absolute;top:0;left:0;width:1100px;transform-origin:0 0;transform:scale(var(--s,.4));pointer-events:none}
.fx-meta{display:grid;gap:6px;padding:0 4px}
.fx-no{font-family:var(--f-kaku);font-size:12px;letter-spacing:.2em;color:var(--fx-gold)}
.fx-name{margin:0;font-size:22px;font-weight:700;letter-spacing:.06em}
.fx-note{margin:0;font-family:var(--f-kaku);font-size:14px;line-height:1.7;color:var(--fx-sub)}
.fx-open{justify-self:start;margin:4px 4px 0;font:500 15px var(--f-kaku);color:#1A1238;background:linear-gradient(135deg,#FFE7C2,#E9DBFF);border:0;border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 0 22px rgba(233,219,255,.35)}
.fx-open::after{content:"";position:absolute;inset:0;border-radius:18px}
.fx-banner{font-family:var(--f-kaku);font-size:15px;line-height:1.7;border:1px solid var(--fx-gold);border-radius:14px;padding:14px 16px;background:rgba(255,217,160,.08);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fx-foot{margin:0;font-family:var(--f-kaku);font-size:13px;color:var(--fx-sub)}

/* 大きく見る（試し見）の帯 */
.pv{position:fixed;inset:0;z-index:30;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:140px;animation:pvIn .5s ease}
@keyframes pvIn{from{opacity:0}to{opacity:1}}
.pv.A{background:var(--a-bg)} .pv.B{background:var(--b-bg)} .pv.C{background:var(--c-bg)} .pv.D{background:var(--d-bg)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;color:var(--fx-ink);font-family:var(--f-kaku);
  background:rgba(16,11,40,.94);backdrop-filter:blur(12px);border-top:1px solid var(--fx-line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.bar-txt{margin:0;font-size:15px;line-height:1.6;min-width:0}
.bar-txt b{color:var(--fx-gold);font-weight:500}
.bar-btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:500 15px var(--f-kaku);border-radius:999px;padding:11px 20px;cursor:pointer;border:1px solid var(--fx-line);background:transparent;color:var(--fx-ink);display:inline-flex;gap:8px;align-items:center}
.btn.main{border:0;color:#1A1238;background:linear-gradient(135deg,#FFE7C2,#E9DBFF);box-shadow:0 0 22px rgba(233,219,255,.35)}
.btn[disabled]{cursor:progress;opacity:.85}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{margin:0;font-size:14px;line-height:1.6;color:var(--fx-gold);flex-basis:100%}
.msg:empty{display:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);
  font:500 15px var(--f-kaku);color:#fff;background:#2A1F55;border-radius:999px;padding:12px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .5s ease both}
.owner{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;max-width:min(420px,calc(100% - 24px));
  font:14px/1.6 var(--f-kaku);color:#EEE8FF;background:rgba(22,16,48,.95);border-radius:14px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.owner p{margin:0}
.owner small{color:#C3B9E6}
.owner .btn{padding:8px 14px;font-size:14px}

/* 4案に共通の「準備中」 */
.pend{display:inline-block;font-size:12px;letter-spacing:.08em;padding:2px 10px;border-radius:999px;border:1px dashed currentColor;opacity:.9}
[aria-disabled="true"]{cursor:default}

/* ===== 4案に共通 ===== */
:root{
  --a-c1:#9A3A22; --a-c5:#4F6AA8; --a-t5:#DEE5F4; --d-t5:#56702A; --a-deep:#5A3A2E; --a-t1:#F1DFD3; --a-t2:#F6DCE3; --a-t3:#D8EEE7; --a-t4:#F5E6CB;
  --b-band2:#28497A; --b-chip:#FFFFFF;
  --c-paper:#F7F9F4;
}
.logo{display:block;flex:none}
.logo .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:none}95.5%{transform:scaleY(.12)}}
.brandfoot{margin:0;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.6}
.brandfoot .logo{width:34px;height:34px}
.brandfoot b{font-weight:700;margin-right:12px;letter-spacing:.06em}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k,0) * 90ms + 120ms)}
@keyframes rise{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}

/* ===== 案1 ココアのぬくもり ===== */
.dA{font-family:var(--f-maru);color:var(--a-ink);background:var(--a-bg);min-height:100%}
.dA-hero{position:relative;overflow:hidden;background:var(--a-deep);color:#FFF6EF;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:52px 110px}
.dA-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,240,228,.10) 2px,transparent 2.6px) 0 0/28px 28px}
.dA-hero::after{content:"";position:absolute;width:420px;height:420px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(233,180,140,.35),transparent 70%)}
.dA-hin{position:relative;z-index:1;max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.dA-eye{display:inline-block;margin:0 0 16px;padding:6px 16px;border-radius:999px;background:rgba(255,246,239,.14);font-size:14px;letter-spacing:.1em}
.dA h1{margin:0;font-size:clamp(34px,5.4vw,52px);font-weight:700;letter-spacing:.05em;line-height:1.3}
.dA h1 span{color:#F2C9A8}
.dA-lead{margin:16px 0 0;font-size:16px;line-height:1.95;color:#F1DED3;max-width:32em}
.dA-logo{position:relative;width:170px;padding-top:54px}
.dA-logo .logo{width:160px;height:160px;border-radius:50%;box-shadow:0 0 0 8px rgba(255,246,239,.14),0 18px 40px rgba(20,8,4,.45);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{translate:0 -6px}}
.dA-steam{position:absolute;top:0;left:50%;width:96px;height:54px;translate:-58% 0}
.dA-steam .steam{animation:steam 3.4s ease-in-out infinite}
.dA-steam .steam:nth-child(2){animation-delay:.6s}.dA-steam .steam:nth-child(3){animation-delay:1.2s}
@keyframes steam{0%,100%{opacity:.35;translate:0 2px}50%{opacity:.9;translate:0 -5px}}
.dA-wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:70px;color:var(--a-bg);z-index:1}
.dA-body{position:relative;z-index:2;margin-top:-56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.dA-bin{max-width:1000px;margin:0 auto;display:grid;gap:28px}
.dA-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.dA-card{position:relative;overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;height:100%;box-sizing:border-box;padding:28px 28px 26px;border-radius:30px;
  background:#FFFDFB;color:inherit;text-decoration:none;box-shadow:0 2px 0 rgba(90,58,46,.06),0 16px 34px rgba(90,58,46,.12);transition:transform .3s ease,box-shadow .3s ease}
.dA-card::before{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-70px;border-radius:50%;background:var(--tint);transition:transform .5s ease}
a.dA-card:hover{transform:translateY(-4px);box-shadow:0 2px 0 rgba(90,58,46,.06),0 24px 46px rgba(90,58,46,.18)}
a.dA-card:hover::before{transform:scale(1.25)}
.dA-card>*{position:relative}
.dA-ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(90,58,46,.2)}
.dA-ic svg{width:30px;height:30px}
.dA-t{font-size:22px;font-weight:700;margin-top:6px}
.dA-d{font-size:15px;line-height:1.85;color:var(--a-sub)}
.dA-go{justify-self:start;font-size:15px;font-weight:700;color:var(--a-ink);background:var(--tint);border-radius:999px;padding:7px 18px}
.dA-foot{color:var(--a-sub)} .dA-foot b{color:var(--a-ink)}

/* ===== 案2 すっきり見やすい ===== */
.dB{font-family:var(--f-ud);color:var(--b-ink);background:var(--b-bg);min-height:100%}
.dB-band{position:relative;background:linear-gradient(160deg,var(--b-band) 0%,var(--b-band2) 100%);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.dB-band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:36px 36px}
.dB-in{position:relative;max-width:960px;margin:0 auto}
.dB-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:30px}
.dB-mark{font-size:18px;font-weight:700;letter-spacing:.1em;display:flex;gap:12px;align-items:center}
.dB-mark .logo{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.dB-foot{color:var(--b-sub);padding-top:6px} .dB-foot b{color:var(--b-ink)}
.dB-fs{display:flex;align-items:center;gap:8px;font-size:14px;color:#D5E2F3}
.dB-seg{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:8px;overflow:hidden}
.dB-seg button{font:700 15px var(--f-ud);color:#fff;background:transparent;border:0;padding:8px 14px;cursor:pointer}
.dB-seg button[aria-pressed="true"]{background:#fff;color:var(--b-band)}
.dB-eye{margin:0 0 10px;font-size:17px;color:#D5E2F3}
.dB h1{margin:0;font-size:clamp(32px,4.8vw,46px);font-weight:700;letter-spacing:.02em}
.dB-lead{margin:14px 0 0;font-size:18px;line-height:1.85;color:#E6EEF8;max-width:36em}
.dB-chips{position:relative;z-index:1;max-width:960px;margin:-26px auto 0;display:flex;flex-wrap:wrap;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dB-chip{font:700 15px var(--f-ud);color:var(--b-band);background:var(--b-chip);border:1px solid var(--b-line);border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 14px rgba(29,53,87,.1);display:inline-flex;gap:8px;align-items:center}
.dB-chip svg{width:18px;height:18px}
.dB-chip:hover{border-color:var(--b-link)}
.dB-bodyw{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.dB-body{max-width:960px;margin:0 auto;display:grid;gap:22px}
.dB-list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.dB-row{scroll-margin-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:24px 26px;background:var(--b-card);border:1px solid var(--b-line);border-radius:12px;color:inherit;text-decoration:none;transition:border-color .2s,box-shadow .2s}
a.dB-row:hover{border-color:var(--b-link);box-shadow:0 0 0 3px rgba(31,91,168,.14)}
.dB-row.flash{box-shadow:0 0 0 4px rgba(31,91,168,.35)}
.dB-ic{width:60px;height:60px;border-radius:10px;background:var(--b-tint);color:var(--b-band);display:grid;place-items:center}
.dB-ic svg{width:32px;height:32px}
.dB-tx{display:grid;gap:6px;min-width:0}
.dB-t{font-size:23px;font-weight:700}
.dB-d{font-size:17px;line-height:1.8;color:var(--b-sub)}
.dB-url{font-size:14px;color:var(--b-link);overflow-wrap:anywhere}
.dB-go{font-size:16px;font-weight:700;color:var(--b-link);border:2px solid var(--b-link);border-radius:8px;padding:10px 16px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.dB-go svg{width:20px;height:20px}
a.dB-row:hover .dB-go{background:var(--b-link);color:#fff}

var LOGO_LINE = '<svg viewBox="10 10 80 80" fill="currentColor"><path d="M20 14.6H81Q86.2 14.6 86.2 19.8V81.2Q86.2 86.4 81 86.4H20Q15.6 86.4 15.6 82V80Q15.6 75.4 20 75.4H55.5Q64.5 75.4 64.5 66.4V33.4Q64.5 24.4 55.5 24.4H20Q15.6 24.4 15.6 19.8V19Q15.6 14.6 20 14.6Z"/>'
 +'<circle cx="26.4" cy="44.5" r="3.4"/><circle cx="49.8" cy="44.5" r="3.4"/><path d="M19 54.2Q38.5 71 58.4 54.8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>';
function brandFoot(cls){ return '<p class="brandfoot '+cls+'">'+LOGO+'<span><b>ココア</b>'+esc(TEXT.foot)+'</span></p>'; }
function hostOf(u){ try{ return new URL(u).host; }catch(e){ return ""; } }
function li(i, inner){ return '<li class="rise" style="--k:'+i+'">'+inner+'</li>'; }

var RENDER = {
  A:function(live){
    var cols=["--a-c1","--a-c2","--a-c3","--a-c4","--a-c5"], tints=["--a-t1","--a-t2","--a-t3","--a-t4","--a-t5"];
    var steam='<svg class="dA-steam" viewBox="0 0 90 50" aria-hidden="true" fill="none" stroke="#F2C9A8" stroke-width="3.4" stroke-linecap="round">'
     +'<path class="steam" d="M27 44c-6-8 6-13 0-22"/><path class="steam" d="M45 46c-6-9 6-14 0-26"/><path class="steam" d="M63 44c-6-8 6-13 0-22"/></svg>';
    return '<div class="dA"><header class="dA-hero"><div class="dA-hin"><div><p class="dA-eye">'+esc(TEXT.eye)+'</p><h1>ココアの<span>ご案内</span></h1><p class="dA-lead">'+esc(TEXT.lead)+'</p></div><div class="dA-logo">'+steam+LOGO+'<span class="dA-say">いつも ありがとう<br>ございます</span></div></div>'
     +'<span class="dA-mm m1" aria-hidden="true"></span><span class="dA-mm m2" aria-hidden="true"></span><span class="dA-mm m3" aria-hidden="true"></span><span class="dA-mm m4" aria-hidden="true"></span><span class="dA-mm m5" aria-hidden="true"></span>'
     +'<svg class="dA-wave" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 40C150 0 300 0 450 30s300 40 450 10 220-30 300-10V70H0z"/></svg></header>'
     +'<div class="dA-body"><div class="dA-bin"><ul class="dA-grid">'+LINKS.map(function(l,i){
       return li(i, tagOpen("dA-card",l,live).replace('class="dA-card"','class="dA-card" style="--tint:var('+tints[i]+')"')
        +'<span class="dA-ic" style="background:var('+cols[i]+')">'+ICON[l.icon]+'</span><span class="dA-t">'+esc(l.title)+'</span><span class="dA-d">'+esc(l.desc)+'</span><span class="dA-go">'+goLabel(l,"ひらく →")+'</span>'+tagClose(l,live));
     }).join("")+'</ul>'+brandFoot("dA-foot")+'</div></div></div>';
  },
  B:function(live){
    return '<div class="dB"><div class="dB-band"><span class="dB-wm" aria-hidden="true">'+LOGO_LINE+'</span><div class="dB-in"><div class="dB-top"><span class="dB-mark">'+LOGO+'ココア</span>'
     +'<span class="dB-fs">文字の大きさ<span class="dB-seg" role="group" aria-label="文字の大きさ"><button type="button" data-fs="n" aria-pressed="true">標準</button><button type="button" data-fs="b" aria-pressed="false">大きく</button></span></span></div>'
     +'<p class="dB-eye">'+esc(TEXT.eye)+'</p><h1>'+esc(TEXT.title)+'</h1><p class="dB-lead">'+esc(TEXT.lead)+'</p></div></div>'
     +'<nav class="dB-chips" aria-label="このページの内容">'+LINKS.map(function(l){ return '<button type="button" class="dB-chip" data-jump="'+l.key+'">'+ICON[l.icon]+esc(l.tag)+'</button>'; }).join("")+'</nav>'
     +'<div class="dB-bodyw"><div class="dB-body"><ul class="dB-list">'+LINKS.map(function(l,i){
       var h=isUrl(l.url)?hostOf(l.url):"";
       return li(i, tagOpen("dB-row",l,live).replace('class="dB-row"','class="dB-row" data-key="'+l.key+'"')
        +'<span class="dB-ic">'+ICON[l.icon]+'</span><span class="dB-tx"><span class="dB-tag">'+esc(l.tag)+'</span><span class="dB-t">'+esc(l.title)+'</span><span class="dB-d">'+esc(l.desc)+'</span>'+(h?'<span class="dB-url">'+esc(h)+'</span>':'')+'</span><span class="dB-go">'+goLabel(l,"開く"+ICON.arrow)+'</span>'+tagClose(l,live));
     }).join("")+'</ul>'
     +'<div class="dB-note">'+INFO+'<p>このページは、読みまちがえにくい文字（UDフォント）を使っています。上の「大きく」を押すと、文字が大きくなります。</p></div>'+brandFoot("dB-foot")+'</div></div></div>';
  },
  C:function(live){
    return '<div class="dC"><div class="dC-sprig">'+SPRIG+'</div><div class="dC-wrap"><header class="dC-side"><div class="dC-v"><h1>ココアのご案内</h1><p class="dC-eye">'+esc(TEXT.eye)+'</p></div><span class="dC-seal">'+LOGO+'</span></header>'
     +'<div class="dC-main"><p class="dC-lead">'+esc(TEXT.lead)+'</p><ul class="dC-list">'+LINKS.map(function(l,i){
       return li(i, tagOpen("dC-item",l,live)+'<span class="dC-k" aria-hidden="true">'+KMARK[l.key]+'</span><span class="dC-tag">'+ICON[l.icon]+esc(l.tag)+'</span><span class="dC-t">'+esc(l.title)+'</span><span class="dC-d">'+esc(l.desc)+'</span><span class="dC-go">'+goLabel(l,"ページをひらく")+'</span>'+tagClose(l,live));
     }).join("")+'</ul><div class="dC-colo"><span class="dC-colo-l">発行</span><span class="dC-colo-n">ココア</span>'+LOGO+'</div><p class="dC-foot">'+esc(TEXT.foot)+'</p></div></div></div>';
  },
  D:function(live){
    var colv=["--d-t1","--d-t2","--d-t3","--d-t4","--d-t5"];
    return '<div class="dD"><div class="dD-wrap"><header class="dD-head"><div><p class="dD-eye">'+esc(TEXT.eye)+'</p><div class="dD-title">'+LOGO+'<h1>'+esc(TEXT.title)+'</h1></div><div class="dD-bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p class="dD-lead">'+esc(TEXT.lead)+'</p></div>'
     +'<ul class="dD-legend" aria-hidden="true">'+LINKS.map(function(l,i){ return '<li><i style="background:var('+colv[i]+')"></i>'+esc(l.tag)+'</li>'; }).join("")+'</ul></header>'
     +'<ul class="dD-grid">'+LINKS.map(function(l,i){
       return li(i, tagOpen("dD-tile t"+(i+1),l,live)+'<span class="dD-big" aria-hidden="true">'+ICON[l.icon]+'</span><span class="dD-top"><span class="dD-tag">'+esc(l.tag)+'</span><span class="dD-ic" aria-hidden="true">'+ICON[l.icon]+'</span></span><span class="dD-t">'+esc(l.title)+'</span><span class="dD-d">'+esc(l.desc)+'</span><span class="dD-go">'+(isUrl(l.url)?ICON.arrow:'<span class="pend">準備中</span>')+'</span>'+tagClose(l,live));
     }).join("")+'</ul>'+brandFoot("dD-foot")+'</div></div>';
  }
};
/* 案2の「文字の大きさ」と、目次のボタン（実際に見ている画面だけで動かす） */
function wire(root){
  var dB=root.querySelector(".dB");
  if(!dB) return;
  function setFs(big){
    dB.classList.toggle("big",big);
    dB.querySelectorAll("[data-fs]").forEach(function(b){ b.setAttribute("aria-pressed", String((b.getAttribute("data-fs")==="b")===big)); });
  }
  try{ setFs(localStorage.getItem("cocoa-fs")==="b"); }catch(e){}
  dB.addEventListener("click",function(e){
    var f=e.target.closest("[data-fs]");
    if(f){ var big=f.getAttribute("data-fs")==="b"; setFs(big); try{ localStorage.setItem("cocoa-fs", big?"b":"n"); }catch(x){} return; }
    var j=e.target.closest("[data-jump]");
    if(j){ var row=dB.querySelector('.dB-row[data-key="'+j.getAttribute("data-jump")+'"]'); if(row){ row.scrollIntoView({behavior:"smooth",block:"start"}); row.classList.add("flash"); setTimeout(function(){row.classList.remove("flash");},1400); } }
  });
}
var app=document.getElementById("app");
app.innerHTML=RENDER["A"](true);
wire(app);
})();
</script>
